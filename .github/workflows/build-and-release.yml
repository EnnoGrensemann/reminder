name: Build APK & Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/GeoReminder.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/GeoReminder-debug.apk
          ls -lh release-assets/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoReminder-APK
          path: release-assets/*.apk

      - name: Determine Release Tag Name
        id: tag_info
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag_name }}
          name: "GeoReminder ${{ steps.tag_info.outputs.tag_name }}"
          body: |
            ## 📍 GeoReminder – Standort-Erinnerungen (${{ steps.tag_info.outputs.tag_name }})

            Automatisch erstellter APK-Release aus Commit `${{ github.sha }}`.

            ### 📲 Installation auf Android
            1. Lade unten unter **Assets** die Datei **`GeoReminder.apk`** herunter.
            2. Öffne die heruntergeladene APK-Datei auf deinem Android-Smartphone und bestätige die Installation.
            3. Erlaube beim ersten Start den Standortzugriff (**„Immer zulassen“**) sowie **Benachrichtigungen**, damit die Popup-Notifications beim Betreten deiner Standorte zuverlässig ausgelöst werden.
          files: |
            release-assets/GeoReminder.apk
            release-assets/GeoReminder-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
